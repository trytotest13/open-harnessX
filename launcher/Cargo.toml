[package]
name = "open-harness"
version = "0.2.0"
edition = "2021"
description = "Open Harness — local AI supervisor (llama.cpp engine, model manager web UI, opt-in dsh agent IDE)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.37.1"
wry = "0.57.0"
rfd = "0.15"
pdf-extract = "0.12.1"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
strip = true
